[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minibatch-kmeans"
version = "0.1.2"
description = "Mini-batch k-means clustering implemented in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Miroojin Bakshi" }]
keywords = ["k-means", "clustering", "pytorch", "minibatch", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "scikit-learn>=1.3",
    "torch>=2.0",
    "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/mb-14/minibatch-kmeans"
Documentation = "https://mb-14.github.io/minibatch-kmeans/"
Repository = "https://github.com/mb-14/minibatch-kmeans"
Issues = "https://github.com/mb-14/minibatch-kmeans/issues"

[project.optional-dependencies]
triton = [
    "torch>=2.4; platform_system == 'Linux'",
    "triton>=3.0; platform_system == 'Linux'",
]
dev = ["pdoc>=14", "pre-commit>=3.5", "ruff==0.17.4"]
eval = [
    "clustering-benchmarks>=1.1",
    "fastkmeans>=0.5.0",
    "flash-kmeans>=0.3.1",
    "matplotlib>=3.8",
    "nvitop>=1.4",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["minibatch_kmeans", "evaluation"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "clustering-data-v1",
    "pdoc_html",
    "profiles",
    "references",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF",  # ruff-specific (unused noqa, unused unpacked vars, ...)
    "SIM",  # simplifiable code
    "C4",  # unnecessary comprehensions / collection calls
    "PERF",  # performance anti-patterns
    "PIE",  # redundant code (pass, duplicate keys, ...)
    "RET",  # needless else-after-return, redundant assignments
    "ISC",  # implicit string concatenation
    "NPY",  # deprecated NumPy APIs
    "ERA",  # commented-out code
    "ARG",  # unused function arguments
    "BLE",  # blind `except Exception`
    "S110",  # try/except/pass
    "TRY",  # exception-handling anti-patterns
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "PLR0124",  # comparison with itself
    "C90",  # mccabe complexity
]
ignore = [
    "E501",  # line length is handled by the formatter
    "B905",  # zip() without strict=
    "RUF001",  # ambiguous unicode in strings (Greek letters are intentional)
    "RUF002",  # ambiguous unicode in docstrings
    "RUF003",  # ambiguous unicode in comments
    "TRY003",  # long messages in exception constructors
    "TRY004",  # TypeError for type checks (would change raised exceptions)
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["torch.device"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
"*.ipynb" = ["E402"]
