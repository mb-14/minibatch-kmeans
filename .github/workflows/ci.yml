name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.4"
          args: check --output-format=github

      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.4"
          args: format --check --diff

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          activate-environment: true

      # CPU-only PyTorch keeps the install small; CUDA-only tests skip themselves.
      - name: Install dependencies
        run: uv pip install --torch-backend cpu -e ".[eval]" pytest

      - name: Run tests
        run: python -m pytest -q -rs
