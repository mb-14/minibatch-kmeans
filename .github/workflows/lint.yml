name: Lint

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.4"
          args: check --output-format=github

      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.4"
          args: format --check --diff
